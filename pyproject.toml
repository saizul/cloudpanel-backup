[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpanel-backup"
dynamic = ["version"]
description = "Back up and restore CloudPanel sites: files with excludes, MariaDB dumps, WordPress detection, S3/R2/B2 or rsync upload, GFS retention, checksummed manifests, age/GPG encryption, verify and systemd timers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["cloudpanel", "backup", "restore", "mariadb", "wordpress", "s3", "cloudflare-r2", "backblaze-b2", "vps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/cloudpanel-backup"
Issues = "https://github.com/saizul/cloudpanel-backup/issues"
Changelog = "https://github.com/saizul/cloudpanel-backup/blob/main/CHANGELOG.md"

[project.scripts]
cloudpanel-backup = "cloudpanel_backup.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cloudpanel_backup._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudpanel_backup = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
